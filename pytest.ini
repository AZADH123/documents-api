# ====================================================================
# pytest configuration.
# This file is read automatically when you run `pytest`.
# ====================================================================

[pytest]
# asyncio_mode=auto: lets pytest-asyncio run async tests without
# extra decorators like @pytest.mark.asyncio.
asyncio_mode = auto

# Where pytest should look for test files.
testpaths = tests

# Pattern for test file names.
python_files = test_*.py

# Show short, useful tracebacks.
addopts = -ra --strict-markers